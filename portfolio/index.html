<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16171d" />
    <meta name="description" content="NongFeen's portfolio and projects." />
    <title>Portfolio | NongFeen</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="portfolio">
      <header class="intro">
        <h1>Portfolio</h1>
        <p class="intro-copy">All my work and projects</p>
      </header>

      <section aria-labelledby="projects-heading">
        <h2 id="projects-heading">Projects</h2>
        <div class="projects">
          <!--
            To add a project, copy one <article class="project"> block below.
            - Put screenshots in the images/ folder and point src at them.
            - Delete the <img> line if the project has no picture.
            - Delete any link you don't need.
          -->
          <article class="project">
            <img
              class="project-image"
              src="images/example.svg"
              alt="Screenshot of Project title"
              loading="lazy"
            />
            <div class="project-body">
              <h3>Project title</h3>
              <p class="project-description">
                Short description of what you built and why.
              </p>
              <ul class="tags">
                <li>React</li>
                <li>TypeScript</li>
              </ul>
              <div class="project-links">
                <a href="#">Live demo</a>
                <a href="#">Source code</a>
              </div>
            </div>
          </article>
        </div>
      </section>

      <section class="section" aria-labelledby="about-heading">
        <h2 id="about-heading">About</h2>
        <p>Add your introduction here.</p>
      </section>

      <section class="section" aria-labelledby="contact-heading">
        <h2 id="contact-heading">Contact</h2>
        <p>Add how people can reach you here.</p>
      </section>

      <footer>
        <a href="/">&larr; Home</a>
      </footer>
    </main>
  </body>
</html>
