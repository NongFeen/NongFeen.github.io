<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16171d" />
    <title>Division 2 Tools</title>
    <style>
      :root {
        --text: #6b6375;
        --text-h: #08060d;
        --bg: #fff;
        --border: #e5e4e7;
        --accent: #aa3bff;
        --accent-border: #aa3bff80;
        --shadow: #0000001a 0 10px 15px -3px, #0000000d 0 4px 6px -2px;
        color-scheme: light dark;
        color: var(--text);
        background: var(--bg);
        font: 18px/1.45 system-ui, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.18px;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #9ca3af;
          --text-h: #f3f4f6;
          --bg: #16171d;
          --border: #2e303a;
          --accent: #c084fc;
          --accent-border: #c084fc80;
          --shadow: #0006 0 10px 15px -3px, #00000040 0 4px 6px -2px;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
        padding: 32px 20px;
        box-sizing: border-box;
      }
      h1 {
        color: var(--text-h);
        font-weight: 500;
        font-size: 56px;
        letter-spacing: -1.68px;
        margin: 32px 0;
      }
      p {
        margin: 0;
      }
      a {
        color: var(--accent);
        text-underline-offset: 3px;
      }
      .cards {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
        max-width: 900px;
        margin-bottom: 16px;
      }
      .card {
        display: block;
        min-width: 220px;
        box-sizing: border-box;
        padding: 20px 24px;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        text-decoration: none;
        background: var(--bg);
        transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      }
      .card:hover,
      .card:focus-visible {
        border-color: var(--accent-border);
        box-shadow: var(--shadow);
        transform: translateY(-2px);
      }
      .card-title {
        display: block;
        color: var(--text-h);
        font-weight: 600;
      }
      .card-description {
        display: block;
        margin-top: 4px;
        font-size: 15px;
      }
      @media (max-width: 640px) {
        h1 {
          margin: 20px 0;
          font-size: 36px;
        }
        .cards {
          width: 100%;
        }
        .card {
          width: 100%;
          max-width: 400px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Division 2 Tools</h1>
    <nav class="cards" aria-label="Division 2 tools">
      <a class="card" href="/tools/division/loadout/">
        <span class="card-title">Loadout Calculator</span>
        <span class="card-description">Work out your build's damage</span>
      </a>
      <a class="card" href="/tools/division/bloodmoontimer/">
        <span class="card-title">Blood Moon Timer</span>
        <span class="card-description">Track the Blood Moon cycle</span>
      </a>
    </nav>
    <p><a href="/">&larr; Home</a></p>
  </body>
</html>
