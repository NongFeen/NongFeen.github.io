<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16171d" />
    <title>Page not found</title>
    <style>
      :root {
        --text: #6b6375;
        --text-h: #08060d;
        --bg: #fff;
        --border: #e5e4e7;
        --accent-border: #aa3bff80;
        --shadow: #0000001a 0 10px 15px -3px, #0000000d 0 4px 6px -2px;
        color-scheme: light dark;
        color: var(--text);
        background: var(--bg);
        font: 18px/1.45 system-ui, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.18px;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #9ca3af;
          --text-h: #f3f4f6;
          --bg: #16171d;
          --border: #2e303a;
          --accent-border: #c084fc80;
          --shadow: #0006 0 10px 15px -3px, #00000040 0 4px 6px -2px;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
        padding: 32px 20px;
        box-sizing: border-box;
      }
      h1 {
        color: var(--text-h);
        font-weight: 500;
        font-size: 56px;
        letter-spacing: -1.68px;
        margin: 32px 0 0;
      }
      p {
        margin: 0 0 16px;
      }
      .card {
        display: block;
        padding: 20px 32px;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text-h);
        font-weight: 600;
        text-decoration: none;
        transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      }
      .card:hover,
      .card:focus-visible {
        border-color: var(--accent-border);
        box-shadow: var(--shadow);
        transform: translateY(-2px);
      }
      @media (max-width: 640px) {
        h1 {
          font-size: 36px;
        }
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a class="card" href="/">Back to home</a>
  </body>
</html>
